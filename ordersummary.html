<!DOCTYPE html>
<html lang="en">

<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #delivery-name {
            font-size: 18px;
            text-transform: uppercase;
            font-weight: bold;
        }

        p {
            margin: 5px 0;
        }

        #order-summary-title {
            position: fixed;
            top: 20px;
            left: 20px;
            margin: 0;
            padding: 0;
            z-index: 1100;
            font-size: 28px;
            font-weight: 700;
            margin-right: 20px;
        }

        #order-summary-container {
            width: 95%;
            max-width: 980px;
            margin: 120px auto 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .address-section {
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 2px solid #e0e0e0;
        }

        .address-section h3 {
            font-size: 16px;
            margin-bottom: 15px;
        }

        #change-address-btn {
            margin-top: 10px;
            padding: 10px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        #change-address-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .products-section h3 {
            font-size: 16px;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        #cartItems {
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            margin-bottom: 14px;
            background: #ffffff;
            gap: 18px;
            width: 100%;
        }

        .cart-item-left {
            display: flex;
            align-items: center;
            gap: 18px;
            flex: 1;
            min-width: 0;
        }

        .left-section {
            display: flex;
            gap: 15px;
            flex: 1;
            min-width: 0;
        }

        .item-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .item-name {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .item-price {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .item-quantity {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .item-quantity button {
            width: 24px;
            height: 24px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .item-quantity button:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .remove-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .remove-btn:hover {
            background: #c0392b;
        }

        .cart-item-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            min-width: 120px;
            flex-shrink: 0;
        }

        .footer-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        #total-price {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        #continue-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        #continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

    
    </style>

</head>

<body>
    <h2 id="order-summary-title">Order Summary</h2>

    <div id="order-summary-container">
        <div class="address-section">
            <h3>Deliver to:</h3>
            <div id="delivery-address"></div>
            <button id="change-address-btn">Change Address</button>
        </div>

        <div class="products-section">
            <h3>Products</h3>
            <div id="cartItems"></div>
            <div class="footer-section">
                <div id="total-price">Total: $0.00</div>
                <button id="continue-btn">Continue</button>
            </div>
        </div>
    </div>
    <script>
        let deliverto = document.getElementById("delivery-address");
        deliverto.innerHTML = "";
        let address = JSON.parse(localStorage.getItem("addressdata"));
        if (address) {
            deliverto.innerHTML = `
                <p id="delivery-name">${address.name}</p>
                <p>${address.street}, ${address.city}, ${address.state} - ${address.postal}</p>
                <p>Phone: ${address.phone}</p>
            `;
        } else {
            deliverto.innerHTML = "<p>No delivery address found.</p>";
        }

        document.getElementById("change-address-btn").onclick = function () {
            // Redirect to address page for editing
            window.location.href = "addresspage.html";
        };

        document.getElementById("continue-btn").onclick = function () {
            window.location.href = "paymentpage.html";
        };

        function loadcart() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            let container = document.getElementById("cartItems");
            let totalBox = document.getElementById("total-price");

            if (cart.length == 0) {
                container.innerHTML = "<p style='color: #999; text-align: center;'>Your cart is empty</p>";
                totalBox.innerText = "Total: $0.00";
                return;
            }

            container.innerHTML = "";
            let total = 0;

            cart.forEach(function (item, index) {
                let div = document.createElement("div");
                div.className = "cart-item";
                let priceNumber = parseFloat(item.price.replace("$", ""));
                total += priceNumber * item.quantity;

                div.innerHTML = `
                <div class="cart-item-left">
                    <img src="${item.image}" class="item-image">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">${item.price}</div>
                        <div class="item-quantity">
                            <button onclick="decreaseQuantity(${index})">-</button>
                            ${item.quantity}
                            <button onclick="increaseQuantity(${index})">+</button>
                        </div>
                    </div>
                </div>
                <div class="cart-item-actions">
                    <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                </div>
                `;
                container.appendChild(div);
            });
            totalBox.innerText = "Total: $" + total.toFixed(2);
            localStorage.setItem("total", total.toFixed(2));
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            loadcart();
        }

        function increaseQuantity(index) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart[index].quantity++;
            localStorage.setItem("cart", JSON.stringify(cart));
            loadcart();
        }

        function decreaseQuantity(index) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            if (cart[index].quantity > 1) {
                cart[index].quantity--;
            } else {
                cart.splice(index, 1);
            }
            localStorage.setItem("cart", JSON.stringify(cart));
            loadcart();
        }
        loadcart();
    </script>
</body>

</html>
