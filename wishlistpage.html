<!DOCTYPE html>
<html lang="en">

<head>
    <style> 
        body {
            font-family: arial, sans-serif;
            background-color: #f4f4f4;
        }

        h2 {
            text-align: center;
            margin-top: 0px;
        }

        #products-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .product {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 10px;
            margin: 8px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 260px;
            border: 2px solid #ccc;
            height: 400px;
            position: relative;
        }

        .product img {
            width: 220px;
            height: 280px;
            border-radius: 5px;
            object-fit: contain;
        }

        .name {
            font-size: 17px;
            max-width: 240px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .addtocart,
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .addtocart {
            background-color: #28a745;
            color: white;
        }

        .addtocart:hover {
            background-color: #218838;
        }

        .product-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 10px;
            gap: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .empty-state h3 {
            margin-bottom: 10px
        }

        .shop-btn {
            margin-top: 14px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .image-container {
            position: relative;
            width: 100%;
        }

        .menu-container {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2;
        }

        .menu-button {
            background: transparent;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .dropdown-menu {
            position: absolute;
            top: 42px;
            right: 0;
            display: none;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            min-width: 160px;
            overflow: hidden;
        }

        .dropdown-menu p {
            margin: 0;
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
            color: #333;
        }

        .dropdown-menu p:hover {
            background: #f5f5f5;
        }

        .menu-container:hover .dropdown-menu {
            display: block;
        }
    </style>
</head>

<body>
    <h2>Wishlist</h2>

    <div id="products-container"></div>


</body>

<script>
    function loadProducts() {
        return JSON.parse(localStorage.getItem("wishlist")) || [];
    }

    const productsContainer = document.getElementById("products-container");
    const products = loadProducts();

    if (!products || products.length === 0) {
        productsContainer.innerHTML = `
            <div class="empty-state">
                <h3>Your wishlist is empty</h3>
                <p>Browse our collection and add items you'd like to save for later.</p>
                <button class="shop-btn" id="shopBtn">Shop</button>
            </div>
        `;

        document.getElementById('shopBtn').addEventListener('click', function () {
            window.location.href = 'index.html';
        });

    } else {
        products.forEach(function (product) {
            // Check if product is already in cart (convert IDs to numbers for comparison)
            const cart = JSON.parse(localStorage.getItem("cart")) || [];
            const inCart = cart.some(item => Number(item.id) === Number(product.id));
            productsContainer.innerHTML += `
                <div class="product" id="${product.id}">
                    <div class="image-container">
                        <a class="${product.category}" href="${product.link}"><img src="${product.image}" alt="${product.name}"></a>
                        <div class="menu-container">
                            <button class="menu-button">&#x22EE;</button>
                            <div class="dropdown-menu">
                                <p>Remove from Wishlist</p>
                            </div>
                        </div>
                    </div>
                    <a class="title" href="${product.link}"><p class="name">${product.name}</p></a>
                    <div class="product-actions">
                        <h4 style="margin: 0;">${product.price}</h4>
                        <button class="addtocart" ${inCart ? 'disabled' : ''}>${inCart ? 'Already in cart' : 'Add to cart'}</button>
                    </div>
                </div>
            `;
        });
    }

    // Add event listeners for Remove from Wishlist
    let dropdowns = document.querySelectorAll(".dropdown-menu");
    dropdowns.forEach(function (dropdown) {
        dropdown.querySelector("p").addEventListener("click", function () {
            let productId = dropdown.closest(".product").id;
            let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
            wishlist = wishlist.filter(function (item) {
                return item.id !== productId;
            });
            localStorage.setItem("wishlist", JSON.stringify(wishlist));
            document.getElementById(productId).remove();
        });
    });

    // Add event listeners for Add to Cart buttons
    let addToCartButtons = document.querySelectorAll(".addtocart");
    addToCartButtons.forEach(function (button) {
        button.addEventListener("click", function () {
            const productDiv = button.closest('.product');
            const productId = Number(productDiv.id);
            const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
            const product = wishlist.find(item => Number(item.id) === productId);
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            const inCart = cart.some(item => Number(item.id) === productId);
            if (inCart) {
                button.textContent = "Already in cart";
                button.disabled = true;
            } else {
                // Always add quantity property for cart compatibility
                let imagePath = product.image;
                if (!imagePath.startsWith('images/')) {
                    imagePath = 'images/' + imagePath;
                }
                const productForCart = { ...product, image: imagePath, quantity: 1 };
                cart.push(productForCart);
                localStorage.setItem("cart", JSON.stringify(cart));
                button.textContent = "Already in cart";
                button.disabled = true;
            }
        });
    });
</script>

</html>
