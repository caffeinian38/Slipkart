            border: none;
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: none;

        .heading {

            cursor: pointer;
        }

        .category {

        }

        .category-title {
            font-size: 24px;
            font-weight: bold;
            color: rgb(177, 75, 3);
            border-bottom: 3px solid rgb(177, 75, 3);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .products-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        body {
            display: flex;
            justify-content: center;
            flex-direction: column;
        }

        h4 {
            margin: 5px 0;
            color: #333;
        }

        button {
            margin: 2px;
            padding: 8px 15px;
            background-color: #ff9900;
            border: none;
            border-radius: 3px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .categories {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;

        }

        .cat-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            border-radius: 20px;
            margin: 0;
            gap: 2px;
            height: 25px;
            box-sizing: border-box;



        }

        .cat-btn img {
            width: 17px;
            height: 17px;
            margin-right: 2px;
        }

        .wishlist-btn {
            background: transparent !important;
            border: none;
            padding: 0;
            margin-top: -15px;
            cursor: pointer;
        }

        .wishlist-btn img {

            height: 20px;
            display: block;

        // Helper functions
        function getCart() {
            return JSON.parse(localStorage.getItem("cart")) || [];
        }
        function setCart(cart) {
            localStorage.setItem("cart", JSON.stringify(cart));
        }
        function getWishlist() {
            return JSON.parse(localStorage.getItem("wishlist")) || [];
        }
        function setWishlist(wishlist) {
            localStorage.setItem("wishlist", JSON.stringify(wishlist));
        }

        function isInCart(product) {
            const cart = getCart();
            return cart.some(item => item.name === product.name && item.price === product.price);
        }
        function isInWishlist(product) {
            const wishlist = getWishlist();
            return wishlist.some(item => item.name === product.name && item.price === product.price);
        }

        function renderProducts(productList) {
            productsContainer.innerHTML = "";
            productList.forEach(function (product) {
                const inCart = isInCart(product);
                const inWishlist = isInWishlist(product);
                productsContainer.innerHTML += `
                <div class="product" id="${product.id}">
                    <a class="${product.category}" href="${product.link}"><img src="images/${product.image}" alt="${product.name}"></a>
                    <a class="title" href="${product.link}"><p class="name">${product.name}</p></a>
                    <h4 class="price">${product.price}</h4>
                    <button class="addtocart" ${inCart ? 'disabled' : ''}>${inCart ? 'Added' : 'Add to cart'}</button>
                    <button onclick="alert('Add the product to cart first!')">Buy Now</button>
                    <button class="wishlist-btn${inWishlist ? ' active' : ''}"><img src="images/${inWishlist ? 'redlikebtn.png' : 'whitelikebtn.png'}"></button>
                </div>
            `;
            });

            // Add to cart logic
            let addtocart = document.querySelectorAll(".addtocart");
            addtocart.forEach(function (button) {
                button.addEventListener("click", function () {
                    let productBtn = button.closest(".product");
                    let nameBtn = productBtn.querySelector(".name").innerText;
                    let priceBtn = productBtn.querySelector(".price").innerText;
                    let imageBtn = productBtn.querySelector("img").src;
                    let item = {
                        name: nameBtn,
                        price: priceBtn,
                        image: imageBtn,
                        quantity: 1
                    };
                    let cart = getCart();
                    if (!cart.some(i => i.name === item.name && i.price === item.price)) {
                        cart.push(item);
                        setCart(cart);
                    }
                    button.innerText = "Added";
                    button.disabled = true;
                });
            });

            // Wishlist logic
            let wishlistBtns = document.querySelectorAll(".wishlist-btn");
            wishlistBtns.forEach(function (button) {
                button.addEventListener("click", function () {
                    let productBtn = button.closest(".product");
                    let nameBtn = productBtn.querySelector(".name").innerText;
                    let priceBtn = productBtn.querySelector(".price").innerText;
                    let imageBtn = productBtn.querySelector("img").src;
                    let item = {
                        name: nameBtn,
                        price: priceBtn,
                        image: imageBtn,
                        quantity: 1
                    };
                    let wishlist = getWishlist();
                    let heartImg = button.querySelector("img");
                    if (button.classList.contains("active")) {
                        // Remove from wishlist
                        wishlist = wishlist.filter(i => !(i.name === item.name && i.price === item.price));
                        setWishlist(wishlist);
                        button.classList.remove("active");
                        heartImg.src = "images/whitelikebtn.png";
                    } else {
                        // Add to wishlist if not already present
                        if (!wishlist.some(i => i.name === item.name && i.price === item.price)) {
                            wishlist.push(item);
                            setWishlist(wishlist);
                        }
                        button.classList.add("active");
                        heartImg.src = "images/redlikebtn.png";
                    }
                });
            });
        }



        let Input_bar = document.querySelector("input");
        Input_bar.addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                let query = Input_bar.value.trim();
                if (query) {
                    let products = document.querySelectorAll(".product");
                    products.forEach(function (product) {
                        let name = product.querySelector(".name").innerText.toLowerCase();
                        if (name.includes(query)) {
                            product.style.display = "inline-block";
                        }
                        else {
                            product.style.display = "none";

                        }
                    })
                }
            }
        });

        // Use new renderProducts function everywhere







        // Initial render
        renderProducts(products);

        let catButtons = document.querySelectorAll(".cat-btn");
        catButtons.forEach(function (button) {
            button.addEventListener("click", () => {
                const category = button.dataset.category;
                if (category === "all") {
                    renderProducts(products);
                } else {
                    const filteredProducts = products.filter(product => product.category.toLowerCase() === category.toLowerCase());
                    renderProducts(filteredProducts);
                }
            });
        });
    </script>
</body>

</html>
